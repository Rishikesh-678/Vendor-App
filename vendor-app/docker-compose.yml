services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vendors}
      POSTGRES_USER: ${POSTGRES_USER:-vendors}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-vendors}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-vendors}
      ATTACHMENTS_DIR: /data/attachments
      # Trust X-Forwarded-For so the login rate limit sees the real client IP. Safe only
      # because the backend is not published: nginx is the only thing that can reach it.
      FORWARDED_ALLOW_IPS: "*"
    volumes:
      - attachments:/data/attachments
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8000"

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_BIND:-127.0.0.1}:${FRONTEND_PORT:-8080}:8080"

volumes:
  db_data:
  attachments:
